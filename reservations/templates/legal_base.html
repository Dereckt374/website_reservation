{% load static %}
<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}{% endblock %} — {{ legal.name }}</title>
    <link rel="stylesheet" href="{% static 'css/vtc_landing_2.css' %}">
    <style>
        .legal-page { max-width: 860px; margin: 30px auto 60px; padding: 0 16px; color: var(--dark-text); line-height: 1.6; font-size: 1rem; }
        .legal-page h1 { font-size: 1.9rem; margin-bottom: 6px; }
        .legal-page h2 { font-size: 1.25rem; margin: 28px 0 8px; color: var(--primary-blue); }
        .legal-page p, .legal-page li { margin-bottom: 8px; }
        .legal-page ul { padding-left: 22px; }
        .legal-page .updated { font-style: italic; color: var(--dark-gray); font-size: 0.9rem; }
        .legal-page a { color: var(--primary-blue); }
        .legal-page table { border-collapse: collapse; width: 100%; font-size: 0.92rem; margin: 8px 0; }
        .legal-page th, .legal-page td { border: 1px solid var(--border-gray); padding: 6px 8px; text-align: left; vertical-align: top; }
        .legal-page .back-link { display: inline-block; margin-bottom: 18px; }
    </style>
</head>
<body>

<header class="topbar">
    <a href="{% url 'landing_page' %}" class="logo" title="Accueil">
        <img src="{% static 'images/logo_E_transp.png' %}" alt="Logo {{ legal.name }}">
    </a>
    <p class="subtitle">{% block subtitle %}{% endblock %}</p>
    <a href="{% url 'reservation' %}" class="btn">Demande de trajet</a>
</header>

<main class="legal-page">
    <a href="{% url 'landing_page' %}" class="back-link">← Retour à l'accueil</a>
    {% block content %}{% endblock %}
</main>

<section class="legal">
    {% include "_legal_links.html" %}
</section>

</body>
</html>

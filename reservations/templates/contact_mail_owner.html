<!DOCTYPE html>
<html lang="fr">
<body style="font-family: Arial, sans-serif; color:#333; line-height:1.5; padding:20px;">

  <div style="max-width:600px; margin:auto; border:1px solid #e5e5e5; border-radius:8px; padding:20px;">

    <h2 style="color:#1a73e8; margin-bottom:10px;">
      Nouveau message de contact
    </h2>

    <p>
      Un nouveau message a été envoyé via le formulaire de contact du site.
    </p>

    <hr style="border:none; border-top:1px solid #ddd; margin:20px 0;">

    <h3 style="margin-bottom:5px;">Informations du contact</h3>

    <table style="width:100%; border-collapse:collapse;">
      <tr>
        <td style="padding:6px 0; width:180px; font-weight:bold;">Nom :</td>
        <td style="padding:6px 0;">{{ nom }}</td>
      </tr>
      <tr>
        <td style="padding:6px 0; font-weight:bold;">Prénom :</td>
        <td style="padding:6px 0;">{{ prenom }}</td>
      </tr>
      <tr>
        <td style="padding:6px 0; font-weight:bold;">Téléphone :</td>
        <td style="padding:6px 0;">{{ telephone }}</td>
      </tr>
      <tr>
        <td style="padding:6px 0; font-weight:bold;">Email :</td>
        <td style="padding:6px 0;">{{ email }}</td>
      </tr>
    </table>

    <hr style="border:none; border-top:1px solid #ddd; margin:20px 0;">

    <h3 style="margin-bottom:5px;">Message</h3>
    <div style="background:#f8f8f8; padding:15px; border-radius:6px; white-space: pre-wrap;">
      {{ message }}
    </div>

  </div>
</body>
</html>
